# Default GAT config (CLAUDE.md Â§5.2, Â§6). One YAML per run.
seed: 42

model:
  name: gnn
  backbone: gat
  hidden_dim: 128        # sweep-selected (results/sweep.csv): best val success AUC
  num_layers: 3          # message-passing layers
  num_heads: 4
  dropout: 0.1
  pooling: [mean, max]   # concatenated graph-level readout

graph:
  edges: fully_connected # alternative: knn
  knn_k: 5               # used only if edges == knn
  use_edge_features: true
  use_global_features: true

heads:
  success: true
  xt: true
  run: true

loss:
  # Initial weights; rescaled inversely to loss magnitude after epoch 1 (Â§5.5).
  w_success: 1.0
  w_xt: 1.0
  w_run: 1.0
  adaptive_reweight: false  # inverse-magnitude rebalance starves the success head (AUC 0.77 -> 0.68)

train:
  optimizer: adamw
  lr: 3.0e-4              # sweep-selected (results/sweep.csv): best val success AUC
  weight_decay: 1.0e-4
  batch_size: 32
  max_epochs: 50
  scheduler: cosine
  early_stopping_patience: 7

logging:
  backend: tensorboard   # set to "wandb" if WANDB_API_KEY is configured
  run_name: gnn_default

