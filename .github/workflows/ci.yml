# CI: lint + offline unit tests on every push/PR (CLAUDE.md §12).
# CPU-only torch from the PyTorch index keeps the install small; all tests marked
# offline (network tests are deselected with `-m "not network"`).
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest -q -m "not network"
